<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>ゼロ幅文字チェッカー - Yapps</title>
        <link rel="icon" type="image/png" href="/img/logo.png">

        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="/app-page.css">
        <link rel="stylesheet" href="/simple-textarea.css">
        <link rel="stylesheet" href="/button.css">
        <link rel="stylesheet" href="/badges.css">
        <link rel="stylesheet" href="/box.css">
        <link rel="stylesheet" href="./zero-width-checker.css">

        <script src="/js/jquery-3.5.1.min.js"></script>
        <script src="/js/common.min.js"></script>
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-43EGG0HL47"></script>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5605897321593790" crossorigin="anonymous"></script>
        <script src="/js/adsense.min.js"></script>

        <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@type": "WebSite",
              "name": "Yapps",
              "url": "https://yapps.yotiosoft.com/"
            }
        </script>
    </head>

    <body>
        <header>
            <div id="wrap" style="width: 100%;">
                <div id="header"></div>
            </div>
        </header>

        <div id="wrap">
            <div id="contents-wrap">
                <div class="title">
                    <img src="/img/tools_icon/text/space-checker.svg" width="48" height="48" alt="ゼロ幅文字・不可視文字チェッカー">
                    ゼロ幅文字・不可視文字チェッカー
                    <div class="badge-group">
                        <div class="badge-ver">ver.1.0</div>
                        <div class="badge-clientside">Client Side</div>
                        <div class="badge-offline">Offline OK</div>
                    </div>
                </div>
                <p class="summary">
                    文章に紛れ込んだ、画面には見えないゼロ幅文字、Unicode 不可視文字を検出し、位置と種類を表示します。検出した文字はまとめて除去できます。<br>
                    ※改行・タブなどの制御文字、結合文字、異体字セレクタ、Unicodeタグ文字などは検出対象外です。<br>
                    このツールはお使いのブラウザ内で実行されますので、入力文章がサーバに送信されることは一切ありません。
                </p>

                <div class="app-area" id="app-area-id">
                    <label class="input-label" for="input-textarea">確認するテキスト</label>
                    <textarea name="input-text" id="input-textarea" placeholder="確認したい文章をここに貼り付け" class="simple-textarea"></textarea>

                    <div class="result-toolbar">
                        <p id="result-summary" class="result-summary" role="status" aria-live="polite">テキストを入力すると自動で検出します。</p>
                        <button type="button" id="remove-and-copy" class="button" disabled>特殊文字を除去する</button>
                    </div>
                    <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>

                    <div id="empty-result" class="empty-result">検出結果はここに表示されます。</div>
                    <div id="result-table-wrap" class="result-table-wrap" hidden>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th scope="col">位置</th>
                                    <th scope="col">行・列</th>
                                    <th scope="col">種類</th>
                                    <th scope="col">Unicode</th>
                                </tr>
                            </thead>
                            <tbody id="result-list"></tbody>
                        </table>
                    </div>
                </div>

                <div class="related-apps">
                    <div class="title">関連アプリ</div>
                    <div class="app-list">
                        <div class="box-horizon-area" id="related-apps"></div>
                    </div>
                    <script>apps2box("related-apps", "zero-width-checker", "box-horizontal");</script>
                </div>
            </div>
        </div>

        <footer class="footer_class">
            <div id="footer"></div>
        </footer>
        <script src="./js/zero-width-checker.js"></script>
    </body>
</html>
