  <link rel="icon" href="/img/logo.png">
  <link rel="canonical" href="https://yapps.yotiosoft.com/meaning-brush/">
  <meta name="meaning-brush-api-url" content="https://yapps-meaning-brush-api.ytani0323.workers.dev/api/meaning-brush">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/footer.css">
  <link rel="stylesheet" href="/app-page.css">
  <link rel="stylesheet" href="./style.css">
  <!-- WEB_APPLICATION_STRUCTURED_DATA_START -->

  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "意味ブラシ",
    "url": "https://yapps.yotiosoft.com/meaning-brush/",

    "browserRequirements": "Requires JavaScript and a modern web browser.",
    "inLanguage": "ja",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": 0,
      "priceCurrency": "JPY"
    },
    "publisher": {
      "@type": "Organization",
      "name": "YotioSoft",
      "url": "https://yotiosoft.com/"
    }
  }
  </script>
  <!-- WEB_APPLICATION_STRUCTURED_DATA_END -->
</head>
<body>
  <header><div id="wrap">
    <!-- SITE_HEADER_START -->
    <div id="header">
        <a class="site-header-logo" href="/" aria-label="Yapps トップページ">
            <img src="/img/logo-yapps.svg" width="250" height="100" alt="Yapps">
        </a>

        <nav class="site-header-desktop-nav" aria-label="メインナビゲーション">
            <a href="/about/">About</a>
            <a href="/update/">Change Log</a>
            <a href="https://github.com/YotioSoft/Yapps">GitHub</a>
        </nav>

        <div class="site-header-mobile-nav">
            <input type="checkbox" id="site-menu-toggle">
            <label for="site-menu-toggle" class="site-menu-button" aria-label="メニューを開く"><span></span></label>
            <nav class="site-menu-content" aria-label="モバイルナビゲーション">
                <ul>
                    <li><a href="/about/">About</a></li>
                    <li><a href="/update/">Update</a></li>
                    <li><a href="https://github.com/YotioSoft/Yapps">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </div>
    <!-- SITE_HEADER_END -->
  </div></header>
  <div id="wrap"><main id="contents-wrap">
    <div class="title">意味ブラシ <span class="prototype">試作</span></div>
    <p class="intro">文章を貼り付け、選びたい意味を言葉で指定します。元の文を変えずに、該当箇所だけを選べるか試してください。</p>
    <div class="brush-layout">
      <section class="panel"><label for="source">文章</label><textarea id="source" spellcheck="false" placeholder="ここに文章を貼り付けてください"></textarea><button type="button" id="sample" class="text-button">例文を入れる</button></section>
      <section class="panel"><label for="query">選びたい意味</label><div class="query-row"><input id="query" type="text" placeholder="例：相手に行動を求めている部分"><button id="run" type="button">意味で選ぶ</button></div><div class="suggestions"><button type="button" data-query="相手に行動を求めている部分">依頼</button><button type="button" data-query="書き手の推測">推測</button><button type="button" data-query="断っている部分">断り</button></div><p id="status" role="status" aria-live="polite"></p></section>
    </div>
    <section class="panel result-panel"><div class="result-heading"><h2>選択結果</h2><span id="count"></span></div><p class="hint">ハイライトをクリックすると選択・解除できます。文章を直したら、もう一度「意味で選ぶ」を押してください。</p><div id="result" class="result" aria-label="選択結果"></div><div class="actions"><button id="copy" type="button" disabled>選択部分をコピー</button><button id="delete" type="button" disabled>選択部分を削除</button><button id="clear" type="button" disabled>選択を解除</button></div></section>
    <p class="note">試作版は、文章を文単位に区切って Jev で意味を判定します。判定時には文章と指定した意味が TypeSafe AI に送信されます。選択範囲は文単位です。</p>
  </main></div>
  <footer class="footer_class">
    <!-- SITE_FOOTER_START -->
    <div id="footer">
        <div id="footer-wrap">
            <p><a href="/privacy/">プライバシーポリシー</a></p>

        </div>
    </div>
    <!-- SITE_FOOTER_END -->

  <script type="module" src="./app.mjs"></script>
</body>
</html>
