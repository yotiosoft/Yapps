<html lang="ja">
    <head>
        <meta charset="utf8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>画像RGB値取得 - Yapps</title>
        <link rel="icon" type="image/png" href="/img/logo.png">

        <link rel="stylesheet" href="/style.css">
		<link rel="stylesheet" href="/app-page.css">
		<link rel="stylesheet" href="/simple-textarea.css">
        <link rel="stylesheet" href="/button.css">
        <link rel="stylesheet" href="/checkbox.css">
        <link rel="stylesheet" href="/badges.css">
        <link rel="stylesheet" href="/box.css">
        <link rel="stylesheet" href="./img2color.css">

        <script src="/js/jquery-3.5.1.min.js"></script>
        <script src="/js/common.min.js"></script>
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-43EGG0HL47"></script>

                <!-- WEB_APPLICATION_STRUCTURED_DATA_START -->
                <script type="application/ld+json">
                {
                  "@context": "https://schema.org",
                  "@type": "WebApplication",
                  "name": "画像RGB値取得",
                  "url": "https://yapps.yotiosoft.com/img2color/",
                  "description": "画像ファイルをアップロードし、マウスクリックした位置のRGB値を取得します。",
                  "image": "https://yapps.yotiosoft.com/img/logo.png",
                  "applicationCategory": "UtilitiesApplication",
                  "operatingSystem": "Any",
                  "browserRequirements": "Requires JavaScript and a modern web browser.",
                  "inLanguage": "ja",
                  "isAccessibleForFree": true,
                  "offers": {
                    "@type": "Offer",
                    "price": 0,
                    "priceCurrency": "JPY"
                  },
                  "publisher": {
                    "@type": "Organization",
                    "name": "YotioSoft",
                    "url": "https://yotiosoft.com/"
                  }
                }
                </script>
                <!-- WEB_APPLICATION_STRUCTURED_DATA_END -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5605897321593790"
     crossorigin="anonymous"></script>
        <script src="/js/adsense.min.js"></script>
</head>

    <body>
        <header>
            <div id="wrap" style="width: 100%;">
                <div id="header"></div>
            </div>
        </header>

        <div id="wrap">
            <div id="contents-wrap">
                <div class="title">
                    <img src="/img/tools_icon/img/img2color.svg" type="image/svg+xml" width="48" height="48" alt="画像RGB値取得">
                    画像RGB値取得
                    <div class="badge-group">
                        <div class="badge-ver">ver.1.0</div>
                        <div class="badge-clientside">Client Side</div>
                        <div class="badge-offline">Offline OK</div>
                    </div>
                </div>
                <p class="summary">
                    画像ファイルをアップロードし、マウスクリックした位置のRGB値を取得します。<br>
                    このツールはお使いのブラウザ内で実行されますので、アップロードした画像がサーバに送信されることは一切ありません。
                </p>
                
                <div class="app-area" id="app-area-id">
                    <div class="image-upload-area">
                        <input type="file" id="image-input" accept="image/*">
                        <label for="image-input" class="round-rect-button">
                            <div class="middle-text">
                                画像ファイルを選択
                            </div>
                        </label>
                    </div>
                    
                    <div class="image-display-area">
                        <canvas id="image-canvas"></canvas>
                    </div>
                    
                    <div class="rgb-info-area">
                        <div class="rgb-value">
                            <div class="rgb-label">RGB値:</div>
                            <div id="rgb-value">クリックして値を取得</div>
                            <button id="copy-rgb" class="copy-button" title="RGB値をコピー">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="color-preview">
                            <div class="color-label">色:</div>
                            <div id="color-preview"></div>
                        </div>
                        <div class="hex-value">
                            <div class="hex-label">HEX値:</div>
                            <div id="hex-value">クリックして値を取得</div>
                            <button id="copy-hex" class="copy-button" title="HEX値をコピー">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="position-value">
                            <div class="position-label">位置:</div>
                            <div id="position-value">クリックして値を取得</div>
                        </div>
                    </div>
                </div>

                <!-- 関連アプリセクション -->
                <div class="related-apps">
                    <div class="title">関連アプリ</div>
                    <div class="app-list">
                        <div class="box-horizon-area" id="related-apps">

                            <!-- RELATED_APPS_START target="img2color" -->
                                <div class="box-horizon-wrap">
                                    <a href="/mosaic-faces/">
                                        <div class="box box-horizon">
                                            <img src="/img/tools_icon/img/face_detect.svg" width="128" height="128" alt="顔モザイク加工">
                                            <div class="box-horizon-text">
                                                <p class="tool-title">顔モザイク加工</p>
                                                <p class="summary">入力画像から顔認識を行い、該当箇所をモザイク加工します。</p>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            <!-- RELATED_APPS_END -->

                        </div>

                    </div>
                </div>
            </div>
        </div>

        <footer class="footer_class">
            <div id="footer"></div>
        </footer>
        
        <!-- スクリプトは最後に読み込む -->
        <script src="./js/img2color.min.js"></script>
    </body>
</html>
